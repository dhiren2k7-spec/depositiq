name: DepositIQ Weekly Report

on:
  schedule:
    - cron: "45 10 * * 1"
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies for weasyprint
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libpango-1.0-0 libpangoft2-1.0-0 libpangocairo-1.0-0 \
            libcairo2 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info

      - name: Install Python dependencies
        run: pip install weasyprint openpyxl --break-system-packages

      - name: Run DepositIQ
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # ── Curinos / OneDrive (Option B) ──────────────────────────────────
          # If these four secrets are set, the pipeline fetches live Curinos
          # rates from OneDrive instead of the static config/peer_rates.json.
          # Leave them unset to keep using the static file.
          ONEDRIVE_TENANT_ID:     ${{ secrets.ONEDRIVE_TENANT_ID }}
          ONEDRIVE_CLIENT_ID:     ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
          ONEDRIVE_FILE_PATH:     ${{ secrets.ONEDRIVE_FILE_PATH }}
        run: |
          cd src
          python main.py

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: depositiq-report-${{ github.run_id }}
          path: |
            output/*.xlsx
            output/*.html
            output/*.pdf
          retention-days: 30
